name: Release

on:
  push:
    tags:
      - "v*"

env:
  GO_VERSION: "1.26.3"
  TASK_VERSION: "3.40.1"

permissions:
  contents: write
  packages: write

jobs:
  itest:
    name: Integration tests (${{ matrix.os }}, TSLS ${{ matrix.tsls.server_version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tsls:
          - server_version: "5.1.3"
            typescript_version: "5.9.3"
          - server_version: "6.0.0"
            typescript_version: "6.0.3"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install integration test dependencies
        uses: ./.github/actions/setup-integration-test-env
        with:
          tsls_version: ${{ matrix.tsls.server_version }}
          typescript_version: ${{ matrix.tsls.typescript_version }}

      - name: Run integration tests
        run: task itest

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: [itest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: task test

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Install ifaceguard
        run: |
          go install github.com/n-r-w/ifaceguard/cmd/ifaceguard@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run linter
        run: task lint

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
